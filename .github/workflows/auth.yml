name: Setup Admin Login

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build auth config from secrets
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: node scripts/build-auth.mjs

      - name: Commit auth config
        run: |
          git config user.name "anyaya-bot"
          git config user.email "bot@anyayadesigns.local"
          git add auth.config.js
          if git diff --cached --quiet; then
            echo "Walang pagbabago"
          else
            git commit -m "🔒 update admin login credentials"
            git push
          fi
