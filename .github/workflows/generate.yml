name: Daily Post Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Pillar id override (optional, e.g. tuesday-tech)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate today's post
        env:
          PILLAR: ${{ inputs.pillar }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.mjs

      - name: Commit generated post
        run: |
          git config user.name "anyaya-bot"
          git config user.email "bot@anyayadesigns.local"
          git add content/posts.json assets/posts/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "✨ Generate post draft $(date -u +%Y-%m-%d)"
            git push
          fi
